<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070A12" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#A7F3D0" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="800" height="200" rx="20" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="2" />
  <rect width="796" height="196" x="2" y="2" rx="18" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="8 6" opacity="0.4" />

  <!-- Logo Emblem: Glowing Node Path Hexagon -->
  <g transform="translate(60, 35)">
    <!-- Hexagon Outer Border -->
    <polygon points="65,5 120,35 120,95 65,125 10,95 10,35" fill="#0F172A" stroke="url(#iconGrad)" stroke-width="3.5" filter="url(#glow)" />
    
    <!-- Path Nodes -->
    <path d="M 35,90 L 65,65 L 95,35" stroke="url(#brandGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 35,90 L 65,95 L 95,35" stroke="url(#brandGrad)" stroke-width="2" stroke-dasharray="3 3" opacity="0.7" />
    
    <!-- Node Dots -->
    <circle cx="35" cy="90" r="6" fill="#38BDF8" filter="url(#glow)" />
    <circle cx="65" cy="65" r="7" fill="#34D399" filter="url(#glow)" />
    <circle cx="95" cy="35" r="8" fill="#A7F3D0" filter="url(#glow)" />
    
    <!-- Lightning Bolt Overlay -->
    <path d="M 68,25 L 52,65 L 66,65 L 56,105 L 82,55 L 68,55 Z" fill="url(#brandGrad)" opacity="0.9" filter="url(#glow)"/>
  </g>

  <!-- Typography -->
  <!-- Main Title -->
  <text x="210" y="110" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="72" fill="url(#brandGrad)" letter-spacing="-1">SkillPath</text>

  <!-- Badge Tag -->
  <rect x="535" y="62" width="54" height="24" rx="6" fill="#0284C7" opacity="0.25"/>
  <rect x="535" y="62" width="54" height="24" rx="6" fill="none" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="562" y="78" font-family="system-ui, sans-serif" font-weight="800" font-size="12" fill="#38BDF8" text-anchor="middle">AI 2.5</text>

  <!-- Subtitle -->
  <text x="214" y="145" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="16" fill="#94A3B8" letter-spacing="3">AI-POWERED CAREER INTELLIGENCE PLATFORM</text>
</svg>
