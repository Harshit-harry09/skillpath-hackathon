<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="bg_collaboration" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24153B" />
      <stop offset="100%" stop-color="#120A1E" />
    </linearGradient>
    <filter id="glow_collaboration" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="8" y="8" width="224" height="224" rx="36" fill="url(#bg_collaboration)" stroke="#B8A4ED" stroke-width="3" stroke-opacity="0.6" />
  
  <!-- Subtle inner shadow ring -->
  <rect x="12" y="12" width="216" height="216" rx="32" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.12" />

  <!-- Top Category Tag -->
  <rect x="28" y="24" width="76" height="22" rx="11" fill="#B8A4ED" fill-opacity="0.25" />
  <text x="66" y="39" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="900" fill="#B8A4ED" text-anchor="middle" letter-spacing="1.5">SOFT SKILL</text>

  <!-- Center Graphic -->
  <g filter="url(#glow_collaboration)">
    
            <g transform="translate(120, 115)">
                <circle cx="0" cy="-35" r="16" fill="#B8A4ED" />
                <circle cx="-35" cy="25" r="16" fill="#B8A4ED" />
                <circle cx="35" cy="25" r="16" fill="#B8A4ED" />
                <line x1="0" y1="-35" x2="-35" y2="25" stroke="#B8A4ED" stroke-width="6" opacity="0.6" />
                <line x1="0" y1="-35" x2="35" y2="25" stroke="#B8A4ED" stroke-width="6" opacity="0.6" />
                <line x1="-35" y1="25" x2="35" y2="25" stroke="#B8A4ED" stroke-width="6" opacity="0.6" />
                <circle cx="0" cy="5" r="8" fill="#FFF" />
            </g>
        
  </g>

  <!-- Bottom Skill Name -->
  <text x="120" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">Team Synergy</text>
</svg>