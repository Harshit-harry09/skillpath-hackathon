<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="bg_endurance" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#182F0B" />
      <stop offset="100%" stop-color="#0C1705" />
    </linearGradient>
    <filter id="glow_endurance" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="8" y="8" width="224" height="224" rx="36" fill="url(#bg_endurance)" stroke="#84CC16" stroke-width="3" stroke-opacity="0.6" />
  
  <!-- Subtle inner shadow ring -->
  <rect x="12" y="12" width="216" height="216" rx="32" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.12" />

  <!-- Top Category Tag -->
  <rect x="28" y="24" width="76" height="22" rx="11" fill="#84CC16" fill-opacity="0.25" />
  <text x="66" y="39" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="900" fill="#84CC16" text-anchor="middle" letter-spacing="1.5">ATHLETIC</text>

  <!-- Center Graphic -->
  <g filter="url(#glow_endurance)">
    
            <g transform="translate(120, 115)">
                <!-- Running / Kinetic Lightning Falcon -->
                <circle r="46" fill="none" stroke="#84CC16" stroke-width="6" stroke-dasharray="16 8" />
                <path d="M-8 -38 L18 -10 L2 -10 L16 34 L-18 6 L-2 6 Z" fill="#84CC16" />
                <circle cx="0" cy="0" r="4" fill="#FFF" />
            </g>
        
  </g>

  <!-- Bottom Skill Name -->
  <text x="120" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">High Endurance</text>
</svg>