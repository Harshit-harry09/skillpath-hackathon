<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="bg_sql" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E2A38" />
      <stop offset="100%" stop-color="#071720" />
    </linearGradient>
    <filter id="glow_sql" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="8" y="8" width="224" height="224" rx="36" fill="url(#bg_sql)" stroke="#336791" stroke-width="3" stroke-opacity="0.6" />
  
  <!-- Subtle inner shadow ring -->
  <rect x="12" y="12" width="216" height="216" rx="32" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.12" />

  <!-- Top Category Tag -->
  <rect x="28" y="24" width="76" height="22" rx="11" fill="#336791" fill-opacity="0.25" />
  <text x="66" y="39" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="900" fill="#336791" text-anchor="middle" letter-spacing="1.5">DATABASE</text>

  <!-- Center Graphic -->
  <g filter="url(#glow_sql)">
    
            <g transform="translate(120, 115)">
                <ellipse cx="0" cy="-35" rx="55" ry="18" fill="#336791" />
                <path d="M-55 -35 L-55 0 C-55 10 -30 18 0 18 C30 18 55 10 55 0 L55 -35 Z" fill="#2A5375" />
                <ellipse cx="0" cy="0" rx="55" ry="18" fill="#336791" />
                <path d="M-55 0 L-55 35 C-55 45 -30 53 0 53 C30 53 55 45 55 35 L55 0 Z" fill="#20405A" />
                <ellipse cx="0" cy="35" rx="55" ry="18" fill="#4B88B8" />
            </g>
        
  </g>

  <!-- Bottom Skill Name -->
  <text x="120" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">SQL & Data</text>
</svg>