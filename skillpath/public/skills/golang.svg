<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="bg_golang" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042638" />
      <stop offset="100%" stop-color="#021520" />
    </linearGradient>
    <filter id="glow_golang" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="8" y="8" width="224" height="224" rx="36" fill="url(#bg_golang)" stroke="#00ACD7" stroke-width="3" stroke-opacity="0.6" />
  
  <!-- Subtle inner shadow ring -->
  <rect x="12" y="12" width="216" height="216" rx="32" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.12" />

  <!-- Top Category Tag -->
  <rect x="28" y="24" width="76" height="22" rx="11" fill="#00ACD7" fill-opacity="0.25" />
  <text x="66" y="39" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="900" fill="#00ACD7" text-anchor="middle" letter-spacing="1.5">LANG</text>

  <!-- Center Graphic -->
  <g filter="url(#glow_golang)">
    
            <rect x="45" y="60" width="150" height="120" rx="24" fill="#00ACD7" />
            <text x="120" y="145" font-family="system-ui, sans-serif" font-weight="900" font-size="64" fill="#FFFFFF" text-anchor="middle" letter-spacing="-1">GO</text>
        
  </g>

  <!-- Bottom Skill Name -->
  <text x="120" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">Go Cloud</text>
</svg>