<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="bg_docker" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A2540" />
      <stop offset="100%" stop-color="#051329" />
    </linearGradient>
    <filter id="glow_docker" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="8" y="8" width="224" height="224" rx="36" fill="url(#bg_docker)" stroke="#2496ED" stroke-width="3" stroke-opacity="0.6" />
  
  <!-- Subtle inner shadow ring -->
  <rect x="12" y="12" width="216" height="216" rx="32" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.12" />

  <!-- Top Category Tag -->
  <rect x="28" y="24" width="76" height="22" rx="11" fill="#2496ED" fill-opacity="0.25" />
  <text x="66" y="39" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="900" fill="#2496ED" text-anchor="middle" letter-spacing="1.5">DEVOPS</text>

  <!-- Center Graphic -->
  <g filter="url(#glow_docker)">
    
            <g transform="translate(120, 120)">
                <rect x="-38" y="-36" width="18" height="16" rx="2" fill="#2496ED" />
                <rect x="-16" y="-36" width="18" height="16" rx="2" fill="#2496ED" />
                <rect x="6" y="-36" width="18" height="16" rx="2" fill="#2496ED" />
                <rect x="-38" y="-16" width="18" height="16" rx="2" fill="#2496ED" />
                <rect x="-16" y="-16" width="18" height="16" rx="2" fill="#2496ED" />
                <rect x="6" y="-16" width="18" height="16" rx="2" fill="#2496ED" />
                <rect x="28" y="-16" width="18" height="16" rx="2" fill="#2496ED" />
                <path d="M-60 6 C-50 6 -40 28 0 28 C45 28 65 6 65 6 C65 26 45 42 0 42 C-45 42 -60 22 -60 6 Z" fill="#2496ED" />
            </g>
        
  </g>

  <!-- Bottom Skill Name -->
  <text x="120" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">Docker / K8s</text>
</svg>