<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="bg_cpp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1E38" />
      <stop offset="100%" stop-color="#050F1E" />
    </linearGradient>
    <filter id="glow_cpp" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="8" y="8" width="224" height="224" rx="36" fill="url(#bg_cpp)" stroke="#00599C" stroke-width="3" stroke-opacity="0.6" />
  
  <!-- Subtle inner shadow ring -->
  <rect x="12" y="12" width="216" height="216" rx="32" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.12" />

  <!-- Top Category Tag -->
  <rect x="28" y="24" width="76" height="22" rx="11" fill="#00599C" fill-opacity="0.25" />
  <text x="66" y="39" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="900" fill="#00599C" text-anchor="middle" letter-spacing="1.5">LANG</text>

  <!-- Center Graphic -->
  <g filter="url(#glow_cpp)">
    
            <polygon points="120,45 185,82 185,158 120,195 55,158 55,82" fill="#00599C" />
            <text x="120" y="138" font-family="system-ui, sans-serif" font-weight="900" font-size="44" fill="#FFFFFF" text-anchor="middle">C++</text>
        
  </g>

  <!-- Bottom Skill Name -->
  <text x="120" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">C++ High Perf</text>
</svg>