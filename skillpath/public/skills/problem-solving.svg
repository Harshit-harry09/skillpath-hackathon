<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="bg_problem-solving" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#062D24" />
      <stop offset="100%" stop-color="#031712" />
    </linearGradient>
    <filter id="glow_problem-solving" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="8" y="8" width="224" height="224" rx="36" fill="url(#bg_problem-solving)" stroke="#2DD4BF" stroke-width="3" stroke-opacity="0.6" />
  
  <!-- Subtle inner shadow ring -->
  <rect x="12" y="12" width="216" height="216" rx="32" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.12" />

  <!-- Top Category Tag -->
  <rect x="28" y="24" width="76" height="22" rx="11" fill="#2DD4BF" fill-opacity="0.25" />
  <text x="66" y="39" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="900" fill="#2DD4BF" text-anchor="middle" letter-spacing="1.5">SOFT SKILL</text>

  <!-- Center Graphic -->
  <g filter="url(#glow_problem-solving)">
    
            <g transform="translate(120, 115)">
                <!-- Interlocking Puzzle Piece -->
                <path d="M-35 -35 H-5 C-5 -45 5 -45 5 -35 H35 V-5 C45 -5 45 5 35 5 V35 H5 C5 25 -5 25 -5 35 H-35 V5 C-25 5 -25 -5 -35 -5 Z" fill="#2DD4BF" />
                <circle cx="0" cy="0" r="10" fill="#062D24" />
            </g>
        
  </g>

  <!-- Bottom Skill Name -->
  <text x="120" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">Problem Solving</text>
</svg>