<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="bg_negotiation" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#381D0B" />
      <stop offset="100%" stop-color="#1C0E05" />
    </linearGradient>
    <filter id="glow_negotiation" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="8" y="8" width="224" height="224" rx="36" fill="url(#bg_negotiation)" stroke="#FFB084" stroke-width="3" stroke-opacity="0.6" />
  
  <!-- Subtle inner shadow ring -->
  <rect x="12" y="12" width="216" height="216" rx="32" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.12" />

  <!-- Top Category Tag -->
  <rect x="28" y="24" width="76" height="22" rx="11" fill="#FFB084" fill-opacity="0.25" />
  <text x="66" y="39" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="900" fill="#FFB084" text-anchor="middle" letter-spacing="1.5">SOFT SKILL</text>

  <!-- Center Graphic -->
  <g filter="url(#glow_negotiation)">
    
            <g transform="translate(120, 115)">
                <!-- Balanced Scales -->
                <line x1="0" y1="-45" x2="0" y2="35" stroke="#FFB084" stroke-width="8" stroke-linecap="round" />
                <line x1="-48" y1="-25" x2="48" y2="-25" stroke="#FFB084" stroke-width="8" stroke-linecap="round" />
                <polygon points="-48,-20 -60,15 -36,15" fill="#FFA060" />
                <polygon points="48,-20 36,15 60,15" fill="#FFA060" />
                <rect x="-24" y="30" width="48" height="12" rx="6" fill="#FFB084" />
            </g>
        
  </g>

  <!-- Bottom Skill Name -->
  <text x="120" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">Deal Negotiation</text>
</svg>