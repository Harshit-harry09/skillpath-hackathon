<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <!-- Clean Card Base with Subtle Border -->
  <rect x="6" y="6" width="228" height="228" rx="32" fill="#F5F3FF" stroke="#B8A4ED" stroke-width="2.5" stroke-opacity="0.8" />
  
  <!-- Inner White Card Inset for contrast -->
  <rect x="12" y="12" width="216" height="216" rx="26" fill="#FFFFFF" fill-opacity="0.85" />

  <!-- Top Category Tag -->
  <rect x="24" y="24" width="80" height="20" rx="10" fill="#7C3AED" fill-opacity="0.15" />
  <text x="64" y="38" font-family="-apple-system, system-ui, sans-serif" font-size="10" font-weight="800" fill="#7C3AED" text-anchor="middle" letter-spacing="1.2">SOFT SKILL</text>

  <!-- Central Graphic Icon -->
  <g>
    
            <g transform="translate(120, 112)">
                <circle cx="0" cy="-30" r="14" fill="#7C3AED" />
                <circle cx="-30" cy="22" r="14" fill="#7C3AED" />
                <circle cx="30" cy="22" r="14" fill="#7C3AED" />
                <line x1="0" y1="-30" x2="-30" y2="22" stroke="#7C3AED" stroke-width="5" opacity="0.4" />
                <line x1="0" y1="-30" x2="30" y2="22" stroke="#7C3AED" stroke-width="5" opacity="0.4" />
                <line x1="-30" y1="22" x2="30" y2="22" stroke="#7C3AED" stroke-width="5" opacity="0.4" />
                <circle cx="0" cy="4" r="7" fill="#B8A4ED" />
            </g>
        
  </g>

  <!-- Bottom Skill Label -->
  <text x="120" y="208" font-family="-apple-system, system-ui, sans-serif" font-size="15" font-weight="800" fill="#1E293B" text-anchor="middle" letter-spacing="-0.3">Team Synergy</text>
</svg>