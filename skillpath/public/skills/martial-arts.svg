<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="bg_martial-arts" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#062E3B" />
      <stop offset="100%" stop-color="#03171E" />
    </linearGradient>
    <filter id="glow_martial-arts" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="8" y="8" width="224" height="224" rx="36" fill="url(#bg_martial-arts)" stroke="#06B6D4" stroke-width="3" stroke-opacity="0.6" />
  
  <!-- Subtle inner shadow ring -->
  <rect x="12" y="12" width="216" height="216" rx="32" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.12" />

  <!-- Top Category Tag -->
  <rect x="28" y="24" width="76" height="22" rx="11" fill="#06B6D4" fill-opacity="0.25" />
  <text x="66" y="39" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="900" fill="#06B6D4" text-anchor="middle" letter-spacing="1.5">DISCIPLINE</text>

  <!-- Center Graphic -->
  <g filter="url(#glow_martial-arts)">
    
            <g transform="translate(120, 115)">
                <circle r="48" fill="#06B6D4" opacity="0.2" />
                <!-- Yin Yang balance & energy blast -->
                <path d="M0 -44 A44 44 0 0 1 0 44 A22 22 0 0 1 0 0 A22 22 0 0 0 0 -44" fill="#06B6D4" />
                <circle cx="0" cy="-22" r="7" fill="#062E3B" />
                <circle cx="0" cy="22" r="7" fill="#06B6D4" />
            </g>
        
  </g>

  <!-- Bottom Skill Name -->
  <text x="120" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">Agility & Reflexes</text>
</svg>