<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="bg_chess-strategy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C1917" />
      <stop offset="100%" stop-color="#0C0A09" />
    </linearGradient>
    <filter id="glow_chess-strategy" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="8" y="8" width="224" height="224" rx="36" fill="url(#bg_chess-strategy)" stroke="#F59E0B" stroke-width="3" stroke-opacity="0.6" />
  
  <!-- Subtle inner shadow ring -->
  <rect x="12" y="12" width="216" height="216" rx="32" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.12" />

  <!-- Top Category Tag -->
  <rect x="28" y="24" width="76" height="22" rx="11" fill="#F59E0B" fill-opacity="0.25" />
  <text x="66" y="39" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="900" fill="#F59E0B" text-anchor="middle" letter-spacing="1.5">STRATEGY</text>

  <!-- Center Graphic -->
  <g filter="url(#glow_chess-strategy)">
    
            <g transform="translate(120, 115)">
                <!-- Knight Chess Piece -->
                <path d="M-30 40 L30 40 L26 28 C26 28 20 18 28 0 C32 -10 26 -28 10 -42 C-6 -50 -26 -35 -24 -15 C-24 -12 -38 -5 -38 12 C-38 25 -30 35 -30 40 Z" fill="#F59E0B" />
                <circle cx="2" cy="-24" r="5" fill="#0C0A09" />
                <rect x="-35" y="38" width="70" height="12" rx="4" fill="#FBBF24" />
            </g>
        
  </g>

  <!-- Bottom Skill Name -->
  <text x="120" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">Chess & Strategy</text>
</svg>