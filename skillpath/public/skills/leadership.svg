<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="bg_leadership" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#382806" />
      <stop offset="100%" stop-color="#1C1403" />
    </linearGradient>
    <filter id="glow_leadership" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="8" y="8" width="224" height="224" rx="36" fill="url(#bg_leadership)" stroke="#E8B94A" stroke-width="3" stroke-opacity="0.6" />
  
  <!-- Subtle inner shadow ring -->
  <rect x="12" y="12" width="216" height="216" rx="32" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.12" />

  <!-- Top Category Tag -->
  <rect x="28" y="24" width="76" height="22" rx="11" fill="#E8B94A" fill-opacity="0.25" />
  <text x="66" y="39" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="900" fill="#E8B94A" text-anchor="middle" letter-spacing="1.5">SOFT SKILL</text>

  <!-- Center Graphic -->
  <g filter="url(#glow_leadership)">
    
            <g transform="translate(120, 115)">
                <!-- Crown -->
                <path d="M-55 25 L-42 -35 L-12 -5 L0 -45 L12 -5 L42 -35 L55 25 Z" fill="#E8B94A" />
                <rect x="-55" y="28" width="110" height="16" rx="8" fill="#F5CF68" />
                <circle cx="-42" cy="-38" r="6" fill="#FFF275" />
                <circle cx="0" cy="-48" r="7" fill="#FFF275" />
                <circle cx="42" cy="-38" r="6" fill="#FFF275" />
            </g>
        
  </g>

  <!-- Bottom Skill Name -->
  <text x="120" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">Executive Leadership</text>
</svg>