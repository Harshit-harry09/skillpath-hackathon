<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="bg_archery-focus" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B0712" />
      <stop offset="100%" stop-color="#1C0308" />
    </linearGradient>
    <filter id="glow_archery-focus" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="8" y="8" width="224" height="224" rx="36" fill="url(#bg_archery-focus)" stroke="#EF4444" stroke-width="3" stroke-opacity="0.6" />
  
  <!-- Subtle inner shadow ring -->
  <rect x="12" y="12" width="216" height="216" rx="32" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.12" />

  <!-- Top Category Tag -->
  <rect x="28" y="24" width="76" height="22" rx="11" fill="#EF4444" fill-opacity="0.25" />
  <text x="66" y="39" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="900" fill="#EF4444" text-anchor="middle" letter-spacing="1.5">PRECISION</text>

  <!-- Center Graphic -->
  <g filter="url(#glow_archery-focus)">
    
            <g transform="translate(120, 115)">
                <circle r="52" fill="#EF4444" opacity="0.25" />
                <circle r="40" fill="none" stroke="#EF4444" stroke-width="8" />
                <circle r="26" fill="none" stroke="#F59E0B" stroke-width="8" />
                <circle r="12" fill="#10B981" />
                <!-- Arrow slicing through center -->
                <line x1="-50" y1="45" x2="45" y2="-50" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
                <polygon points="45,-50 30,-50 45,-35" fill="#FFFFFF" />
            </g>
        
  </g>

  <!-- Bottom Skill Name -->
  <text x="120" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">Target Focus</text>
</svg>