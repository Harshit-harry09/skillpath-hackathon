<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <!-- Clean Card Base with Subtle Border -->
  <rect x="6" y="6" width="228" height="228" rx="32" fill="#FEFAF0" stroke="#F7DF1E" stroke-width="2.5" stroke-opacity="0.8" />
  
  <!-- Inner White Card Inset for contrast -->
  <rect x="12" y="12" width="216" height="216" rx="26" fill="#FFFFFF" fill-opacity="0.85" />

  <!-- Top Category Tag -->
  <rect x="24" y="24" width="80" height="20" rx="10" fill="#E5A910" fill-opacity="0.15" />
  <text x="64" y="38" font-family="-apple-system, system-ui, sans-serif" font-size="10" font-weight="800" fill="#E5A910" text-anchor="middle" letter-spacing="1.2">LANGUAGE</text>

  <!-- Central Graphic Icon -->
  <g>
    
            <rect x="55" y="55" width="130" height="130" rx="22" fill="#F7DF1E" />
            <text x="120" y="146" font-family="-apple-system, system-ui, sans-serif" font-weight="900" font-size="70" fill="#000000" text-anchor="middle" letter-spacing="-2">JS</text>
        
  </g>

  <!-- Bottom Skill Label -->
  <text x="120" y="208" font-family="-apple-system, system-ui, sans-serif" font-size="15" font-weight="800" fill="#1E293B" text-anchor="middle" letter-spacing="-0.3">JavaScript</text>
</svg>