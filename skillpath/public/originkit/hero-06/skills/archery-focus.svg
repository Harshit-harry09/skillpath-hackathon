<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <!-- Clean Card Base with Subtle Border -->
  <rect x="6" y="6" width="228" height="228" rx="32" fill="#FEF2F2" stroke="#EF4444" stroke-width="2.5" stroke-opacity="0.8" />
  
  <!-- Inner White Card Inset for contrast -->
  <rect x="12" y="12" width="216" height="216" rx="26" fill="#FFFFFF" fill-opacity="0.85" />

  <!-- Top Category Tag -->
  <rect x="24" y="24" width="80" height="20" rx="10" fill="#DC2626" fill-opacity="0.15" />
  <text x="64" y="38" font-family="-apple-system, system-ui, sans-serif" font-size="10" font-weight="800" fill="#DC2626" text-anchor="middle" letter-spacing="1.2">PRECISION</text>

  <!-- Central Graphic Icon -->
  <g>
    
            <g transform="translate(120, 112)">
                <circle r="48" fill="#EF4444" opacity="0.15" />
                <circle r="36" fill="none" stroke="#EF4444" stroke-width="7" />
                <circle r="24" fill="none" stroke="#F59E0B" stroke-width="7" />
                <circle r="10" fill="#10B981" />
                <line x1="-45" y1="40" x2="40" y2="-45" stroke="#1F2937" stroke-width="5" stroke-linecap="round" />
                <polygon points="40,-45 28,-45 40,-33" fill="#1F2937" />
            </g>
        
  </g>

  <!-- Bottom Skill Label -->
  <text x="120" y="208" font-family="-apple-system, system-ui, sans-serif" font-size="15" font-weight="800" fill="#1E293B" text-anchor="middle" letter-spacing="-0.3">Target Focus</text>
</svg>