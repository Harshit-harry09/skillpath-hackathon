<!-- updated -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Analyze pipeline</title>
  <desc id="desc">A resume and job description enter the analyze page, pass through validation and deterministic extraction, are persisted to Firestore as a sanitized analysis, then the results page reads the token.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,3 L0,6 Z" fill="#475569"/></marker>
    <style>.box{rx:14;stroke-width:2}.label{font:600 17px Arial,sans-serif;fill:#0f172a}.small{font:13px Arial,sans-serif;fill:#334155}.arrow{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.title{font:700 27px Arial,sans-serif;fill:#0f172a}.tag{font:700 12px Arial,sans-serif;fill:#166534}</style>
  </defs>
  <rect width="1200" height="760" fill="#f8fafc"/>
  <text x="44" y="48" class="title">SkillPath — /api/analyze request pipeline</text>
  <rect x="44" y="92" width="180" height="130" class="box" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="65" y="128" class="label">1. Analyze UI</text><text x="65" y="156" class="small">resume text / PDF</text><text x="65" y="178" class="small">job description</text><text x="65" y="200" class="small">optional bearer token</text>
  <rect x="280" y="92" width="190" height="130" class="box" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="301" y="128" class="label">2. Guard + validate</text><text x="301" y="156" class="small">request id</text><text x="301" y="178" class="small">rate limit</text><text x="301" y="200" class="small">10 MB + PDF signature</text>
  <rect x="526" y="72" width="205" height="170" class="box" fill="#dcfce7" stroke="#4ade80"/>
  <text x="547" y="108" class="label">3. Local analysis</text><text x="547" y="136" class="small">extract role + skills</text><text x="547" y="158" class="small">clean / normalize terms</text><text x="547" y="180" class="small">score gaps + readiness</text><text x="547" y="202" class="small">build summary + prereqs</text>
  <rect x="787" y="92" width="180" height="130" class="box" fill="#e0f2fe" stroke="#38bdf8"/>
  <text x="808" y="128" class="label">4. Persist</text><text x="808" y="156" class="small">sanitized analysis doc</text><text x="808" y="178" class="small">no raw resume/JD</text><text x="808" y="200" class="small">wait for write</text>
  <rect x="1023" y="92" width="135" height="130" class="box" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="1043" y="128" class="label">5. Token</text><text x="1043" y="156" class="small">analysis id</text><text x="1043" y="178" class="small">version/status</text><text x="1043" y="200" class="small">latency header</text>
  <path d="M224 157 L280 157" class="arrow"/><path d="M470 157 L526 157" class="arrow"/><path d="M731 157 L787 157" class="arrow"/><path d="M967 157 L1023 157" class="arrow"/>

  <rect x="240" y="330" width="235" height="140" class="box" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="263" y="368" class="label">6. Results page</text><text x="263" y="396" class="small">GET /api/results/:id</text><text x="263" y="418" class="small">explicit 404 / 503 / 500</text><text x="263" y="440" class="small">server result, no fake cache</text>
  <rect x="550" y="330" width="235" height="140" class="box" fill="#fce7f3" stroke="#f472b6"/>
  <text x="573" y="368" class="label">7. Interactive analysis</text><text x="573" y="396" class="small">confidence reweighting</text><text x="573" y="418" class="small">resources + plan</text><text x="573" y="440" class="small">career content tools</text>
  <rect x="860" y="330" width="235" height="140" class="box" fill="#dcfce7" stroke="#4ade80"/>
  <text x="883" y="368" class="label">8. User state</text><text x="883" y="396" class="small">active job PATCH</text><text x="883" y="418" class="small">metadata history</text><text x="883" y="440" class="small">optional timeline/share</text>
  <path d="M1090 222 C1090 278 355 278 355 330" class="arrow"/>
  <path d="M475 400 L550 400" class="arrow"/><path d="M785 400 L860 400" class="arrow"/>

  <rect x="240" y="560" width="855" height="95" class="box" fill="#fff7ed" stroke="#fb923c"/>
  <text x="265" y="598" class="label">Optional AI branches</text><text x="265" y="624" class="small">Current analyze critical path is deterministic and model-free. Gemini is used by later enrichment/content endpoints with bounded timeout and deterministic fallback metadata.</text>
  <path d="M628 242 L628 560" class="arrow"/>
</svg>
