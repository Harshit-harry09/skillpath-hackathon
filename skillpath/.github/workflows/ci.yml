name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: skillpath/package-lock.json

      - name: Install Dependencies
        working-directory: ./skillpath
        run: npm ci

      - name: TypeScript Static Type Checking
        working-directory: ./skillpath
        run: npx tsc --noEmit

      - name: ESLint Code Quality Verification
        working-directory: ./skillpath
        run: npm run lint

      - name: Deterministic Test Suite
        working-directory: ./skillpath
        run: npm run test

      - name: Next.js Production Build
        working-directory: ./skillpath
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production
        run: npm run build
